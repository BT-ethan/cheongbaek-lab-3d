<html lang="ko">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>청백에프에스 연구실 3D 모델 · 조감도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#16181c; --sub:#5b616b; --line:#d9dce1; --acc:#1f3f8f; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#eceef1; font-family:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); overflow:hidden; }
  #c { position:fixed; inset:0; width:100vw; height:100dvh; display:block; touch-action:none; }
  .hud { position:fixed; left:12px; top:12px; background:rgba(255,255,255,.88); backdrop-filter:blur(6px); border:1px solid var(--line); border-radius:10px; padding:10px 12px; max-width:min(92vw,380px); }
  .hud h1 { font-size:15px; margin:0 0 2px; font-weight:700; letter-spacing:-.2px; }
  .hud p { font-size:11.5px; margin:0; color:var(--sub); line-height:1.5; }
  .opts { display:flex; gap:10px; align-items:center; margin-top:8px; font-size:12px; flex-wrap:wrap; }
  .opts label { display:flex; gap:5px; align-items:center; }
  .opts select { font:inherit; font-size:12px; padding:2px 4px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  #views { position:fixed; left:0; right:0; bottom:0; display:flex; gap:6px; overflow-x:auto; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(to top, rgba(236,238,241,.96), rgba(236,238,241,.0)); scrollbar-width:none; }
  #views::-webkit-scrollbar { display:none; }
  #views button { flex:0 0 auto; font:inherit; font-size:12.5px; padding:8px 12px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; white-space:nowrap; }
  #views button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  #loading { position:fixed; inset:0; display:grid; place-items:center; font-size:13px; color:var(--sub); }
  body.noui .hud, body.noui #views { display:none; }
</style>
</head>

<canvas id="c"></canvas>

  <h1>청백에프에스 연구실 · 3D 모델</h1>
  <p>5,130 × 4,330 mm · 약 21.7㎡ · CH 2,600(추정)<br>드래그 회전 · 휠/핀치 확대 · 우클릭/두 손가락 이동</p>
  <div class="opts">
    <label><input type="checkbox" id="autoCut" checked> 시점 측 벽체 자동 숨김</label>
    <label>천장 <select id="ceil"><option value="auto">자동</option><option value="on">표시</option><option value="off">숨김</option></select></label>
  </div>
</div>
